name: Collect reviewed disclosure ESG data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: official-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Prepare reviewed exchange manifest
        run: python scripts/build_scheduled_collection_manifest.py
      - name: Prepare reviewed official-website manifest
        run: |
          python scripts/build_official_website_source_queue.py
          python scripts/validate_official_website_source_queue.py
          python scripts/prepare_official_download_manifest.py
      - name: Restore collection cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/ci_collection
            output/sync
          key: aegis-ci-data-${{ hashFiles('output/audit/scheduled_collection_manifest_v1_2025.csv', 'output/audit/official_download_manifest_v1_2025.csv') }}
          restore-keys: |
            aegis-ci-data-
      - name: Collect documents
        env:
          PYTHONPATH: src
        run: python scripts/run_scheduled_collection.py
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-official-data
          path: |
            data/raw/ci_collection
            output/audit/scheduled_collection_manifest_v1_2025.csv
            output/audit/scheduled_collection_manifest_v1_2025_summary.json
            output/audit/official_download_manifest_v1_2025.csv
            output/audit/official_download_manifest_v1_2025_summary.json
            output/sync
          retention-days: 30
          if-no-files-found: warn
