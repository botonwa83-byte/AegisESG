name: ESG Data Extraction

on:
  workflow_dispatch:  # 手动触发
  push:
    branches:
      - main
    paths:
      - 'src/aegis_esg/extraction.py'
      - '.github/workflows/extraction.yml'

jobs:
  extract-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "No requirements.txt found"

    - name: Download data files (if needed)
      run: |
        # 如果需要从其他地方下载PDF文件，在这里添加
        echo "Checking data files..."
        ls -lh data/ || echo "Data directory not found"

    - name: Run extraction
      run: |
        PYTHONPATH=src python3 scripts/run_incremental_indicator_extraction.py
      timeout-minutes: 100

    - name: Analyze results
      run: |
        python3 analyze_extraction_simple.py

    - name: Verify rules
      run: |
        python3 test_extraction_quick.py

    - name: Upload extraction results
      uses: actions/upload-artifact@v3
      with:
        name: extraction-results
        path: |
          output/audit/ci_incremental_candidates_v1_2025.csv
          extraction_*.log

    - name: Create summary
      run: |
        echo "## ESG Extraction Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Rule Statistics" >> $GITHUB_STEP_SUMMARY
        python3 -c "
        import sys
        sys.path.insert(0, 'src')
        from aegis_esg.extraction import DIRECT_RULES, RULES
        print(f'- DirectRule: {len(DIRECT_RULES)} rules')
        print(f'- _rule: {len(RULES)} rules')
        print(f'- Total: {len(DIRECT_RULES) + len(RULES)} rules')
        " >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Extraction Results" >> $GITHUB_STEP_SUMMARY
        tail -20 extraction_*.log | head -10 >> $GITHUB_STEP_SUMMARY || echo "Log file not found"
