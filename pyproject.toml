[project]
name = "aegis-esg"
version = "0.1.0"
description = "中国能源上市公司可持续发展（ESG）评价系统"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
mysql = ["sqlalchemy>=2.0,<3", "pymysql>=1.1,<2"]
pdf = ["pymupdf>=1.24,<2", "pdfplumber>=0.11,<1"]
universe = ["openpyxl>=3.1,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
aegis-esg = "aegis_esg.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
